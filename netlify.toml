[build]
command = "npm run build"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
Service-Worker-Allowed = "/"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[edge_functions]]
path = "/*"
function = "basic-auth"
